name: Dependency security refresh and build

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/dependency-security.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tender-watch-dependency-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve dependencies and refresh Bun lockfile
        run: bun install

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): refresh Bun lockfile"
            git push origin HEAD:main
          else
            echo "bun.lock is already up to date"
          fi

      - name: Lint source (currently advisory; repository-wide Prettier baseline is not clean)
        run: bun run lint
        continue-on-error: true

      - name: Build production bundle
        run: bun run build
