name: Tender Finder Pro CI

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "tests/**"
      - "supabase/migrations/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/dependency-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tender-finder-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies (advisory)
        run: bun audit --json
        continue-on-error: true

      - name: Lint source (advisory until the legacy repository formatting baseline is cleaned)
        run: bun run lint
        continue-on-error: true

      - name: Tender discovery and keyword-set regression tests
        run: bun test tests/*.test.ts

      - name: Build production bundle
        run: bun run build

      - name: Smoke-test Vite development and browser rendering
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          bun run dev -- --host 127.0.0.1 --port 5173 > /tmp/vite-dev.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          status=""
          for attempt in $(seq 1 60); do
            status="$(curl -sS -o /tmp/vite-home.html -w '%{http_code}' http://127.0.0.1:5173/ || true)"
            if [ "$status" = "200" ]; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Vite dev server exited before the homepage responded."
              cat /tmp/vite-dev.log
              exit 1
            fi
            sleep 1
          done
          if [ "$status" != "200" ]; then
            echo "Vite dev homepage returned HTTP $status."
            cat /tmp/vite-dev.log
            exit 1
          fi
          node <<'NODE'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              const pageErrors = [];
              page.on("pageerror", (error) => pageErrors.push(error.stack || error.message));
              page.on("console", (message) => {
                if (message.type() === "error") pageErrors.push(message.text());
              });
              const response = await page.goto("http://127.0.0.1:5173/", { waitUntil: "networkidle", timeout: 45000 });
              await page.waitForTimeout(1500);
              const body = await page.locator("body").innerText();
              if (!response || response.status() !== 200) throw new Error("Homepage did not return HTTP 200.");
              if (body.includes("This page didn't load")) throw new Error("Root error boundary rendered.");
              if (!/Tender Watch|Administrator access|Secure Tender Watch/i.test(body)) throw new Error("Tender Watch administrator screen was not rendered.");
              if (pageErrors.length) throw new Error("Browser runtime errors: " + pageErrors.join("\n\n"));
              console.log("Browser smoke test passed.");
            } finally {
              await browser.close();
            }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
          cat /tmp/vite-dev.log
