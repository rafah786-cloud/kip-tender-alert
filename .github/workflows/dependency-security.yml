name: Dependency security refresh and build

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/dependency-security.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tender-watch-dependency-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve dependencies and refresh Bun lockfile
        run: bun install

      - name: Apply available security fixes within declared version ranges
        run: bun audit fix
        continue-on-error: true

      - name: Verify the lockfile after security fixes
        run: bun install

      - name: Commit refreshed dependency manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): refresh Bun lockfile"
            git push origin HEAD:main
          else
            echo "bun.lock is already up to date"
          fi

      - name: Audit remaining dependency advisories
        run: bun audit --json
        continue-on-error: true

      - name: Lint source (currently advisory; repository-wide Prettier baseline is not clean)
        run: bun run lint
        continue-on-error: true

      - name: Build production bundle
        run: bun run build
      - name: Smoke-test Vite development SSR
        shell: bash
        run: |
          set -euo pipefail
          bun run dev -- --host 127.0.0.1 --port 5173 > /tmp/vite-dev.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          status=""
          for attempt in $(seq 1 60); do
            status="$(curl -sS -o /tmp/vite-home.html -w '%{http_code}' http://127.0.0.1:5173/ || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Vite dev server exited before the homepage responded."
              cat /tmp/vite-dev.log
              exit 1
            fi
            sleep 1
          done

          if [ "$status" != "200" ]; then
            echo "Vite dev homepage returned HTTP ${status:-no-response}."
            cat /tmp/vite-dev.log
            exit 1
          fi

          if grep -q "This page didn't load" /tmp/vite-home.html; then
            echo "Vite served the application error fallback instead of the homepage."
            cat /tmp/vite-dev.log
            exit 1
          fi

          echo "Vite development homepage returned HTTP 200 without the application error fallback."
          echo "Homepage bytes: $(wc -c < /tmp/vite-home.html)"
